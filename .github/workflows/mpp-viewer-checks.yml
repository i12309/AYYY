name: AYYY Project Viewer checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: |
          node --check mpp/model.mjs
          node --check mpp/viewer.mjs
          node --check mpp/export-svg.mjs
          node --check mpp/reader-worker.mjs
          node --check src/mpp-route.js
      - name: Test model and browser reader
        run: node --test tests/mpp_model.test.mjs
      - name: Test binary MPP8 / MPP9 / MPP14 files
        run: |
          mkdir -p /tmp/ayyy-mpp-samples
          for file in mpp8recurring.mpp mpp9relations.mpp mpp14resource.mpp; do
            curl --fail --location --silent --show-error "https://raw.githubusercontent.com/mja1337/ms-project-viewer/1153939f746578ef990721c64229bdc6bf782452/test-files/mpxj/$file" -o "/tmp/ayyy-mpp-samples/$file"
          done
          MPP_FIXTURES_DIR=/tmp/ayyy-mpp-samples node --test tests/mpp_binary_compat.test.mjs
      - name: Test static GitHub Pages bundle
        run: python tests/mpp_build_test.py
      - name: Test viewer in Chrome
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/ayyy-mpp-http.log 2>&1 &
          sleep 2
          CHROME_PATH="$(command -v google-chrome)" MPP_FIXTURES_DIR=/tmp/ayyy-mpp-samples node tests/mpp_browser_smoke.mjs
