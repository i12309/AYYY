name: Build browser GEN
on:
  push:
    branches: [main, feat/gen-browser-portal]
    paths:
      - 'family-app/**'
      - 'tests/family-*.test.cjs'
      - '.github/workflows/build-family.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: family-app/package-lock.json
      - name: Install and typecheck/build
        run: |
          npm ci --prefix family-app
          npm run build --prefix family-app
      - name: Run family unit checks
        run: node --test tests/family-*.test.cjs
      - name: Install Chromium for browser smoke
        run: |
          cd family-app
          npx playwright install --with-deps chromium
      - name: Verify GEN in AYYY browser
        run: node family-app/e2e/smoke.mjs
      - name: Commit generated static files
        run: |
          git add family/
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(family): publish static GEN assets [skip ci]"
            git push
          fi
