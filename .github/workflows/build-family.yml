name: Build browser GEN
on:
  push:
    branches: [main, feat/gen-browser-portal]
    paths:
      - 'family-app/**'
      - 'tests/family-*.test.cjs'
      - '.github/workflows/build-family.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: family-app/package-lock.json
      - name: Install and typecheck/build
        run: |
          npm ci --prefix family-app
          npm run build --prefix family-app
      - name: Rebuild AYYY portal index
        run: python3 src/build.py
      - name: Run portal and family unit checks
        run: |
          node tests/model.test.cjs --fixture
          find tests -maxdepth 1 -name '*.test.cjs' -print0 | xargs -0 node --test
      - name: Install Chromium for browser smoke
        run: |
          cd family-app
          npx playwright install --with-deps chromium
      - name: Verify GEN in AYYY browser
        run: node family-app/e2e/smoke.mjs
      - name: Verify private GitHub sync and cross-device restore
        run: node family-app/e2e/github.mjs
      - name: Commit generated static files
        run: |
          git add family/ index.html
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(portal): refresh index and GEN assets [skip ci]"
            git push
          fi
